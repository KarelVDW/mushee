# Gates every PR (and pushes to master) on the same checks that pass locally:
# format check, whole-repo lint, type-check, the unit tests of every workspace
# (api, admin, playback, notation incl. its 100% model coverage gate, web) and
# the build. The API tests spawn real ffmpeg via ffmpeg-static — no system
# packages needed.
name: CI

on:
    push:
        branches: [master]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            # Whole repo: .prettierignore excludes vendored, generated and machine-written files.
            - name: Format check
              run: pnpm format:check

            # Whole repo, non-mutating (`eslint .`); `pnpm lint:fix` is the local autofix.
            - name: Lint
              run: pnpm lint

            - name: Type-check
              run: pnpm type-check

            # Every workspace's `test` except the two that run under coverage below,
            # so no suite runs twice.
            - name: Test (api, admin, playback, ui)
              run: pnpm -r --filter '!@mushee/notation' --filter '!@mushee/web' --if-present test

            - name: Test (notation, with the 100% model coverage gate)
              run: pnpm --filter @mushee/notation test:coverage

            - name: Test (web, with coverage)
              run: pnpm --filter @mushee/web test:coverage

            - name: Build
              run: pnpm build

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm --filter @mushee/web exec playwright install --with-deps chromium webkit

            # Mocked suite only: fully self-contained (API calls intercepted),
            # so no database or backend services are needed.
            - name: E2E (mocked)
              run: pnpm --filter @mushee/web test:e2e

            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: apps/web/playwright-report
                  retention-days: 7
