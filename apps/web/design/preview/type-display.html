<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="../colors_and_type.css" />
        <style>
            html,
            body {
                margin: 0;
                background: var(--color-surface);
            }
            .f {
                padding: 24px 28px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }
            .row {
                display: flex;
                align-items: baseline;
                gap: 14px;
            }
            .lbl {
                font: 600 11px/1 var(--font-label);
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--color-on-surface-variant);
                min-width: 120px;
            }
        </style>
    </head>
    <body>
        <div class="f">
            <div class="row">
                <span class="lbl">type-hero</span
                ><span class="type-hero">The fastest way to get a melody <em style="font-family: var(--font-serif); font-weight: 400">on the page.</em></span>
            </div>
            <div class="row">
                <span class="lbl">type-page</span><span class="type-page">Your scores</span>
            </div>
            <div class="row">
                <span class="lbl">type-title</span><span class="type-title">New score</span>
            </div>
            <div class="row">
                <span class="lbl">type-heading</span><span class="type-heading">Editor defaults</span>
            </div>
            <div class="row">
                <span class="lbl">type-subheading</span><span class="type-subheading">Can Solkey write chords?</span>
            </div>
            <div class="row">
                <span class="lbl">type-label</span><span class="type-label">Clef</span>
            </div>
        </div>
    </body>
</html>
