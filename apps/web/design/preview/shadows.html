<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Shadows — raised, overlay, pop</title>
        <link rel="stylesheet" href="../colors_and_type.css" />
        <style>
            html,
            body {
                margin: 0;
            }
            .card {
                width: 700px;
                box-sizing: border-box;
                background: var(--color-surface);
                padding: 32px 28px;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 22px;
            }
            .swatch {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            .box {
                width: 110px;
                height: 80px;
                background: var(--color-surface-container-lowest);
                border-radius: 8px;
            }
            .pill {
                width: 110px;
                height: 38px;
                background: var(--color-primary-container);
                border-radius: 9999px;
            }
            .name {
                font: var(--type-eyebrow);
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--color-on-surface);
            }
            .v {
                font: 500 11px/1.3 var(--font-mono);
                color: var(--color-on-surface-variant);
                text-align: center;
            }
            .raised {
                box-shadow: var(--shadow-raised);
            }
            .overlay {
                box-shadow: var(--shadow-overlay);
            }
            .offset3 {
                box-shadow: 3px 3px 0 0 #ff2079;
            }
            .offset5 {
                box-shadow: 5px 5px 0 0 #ff2079;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="swatch">
                <div class="box raised"></div>
                <span class="name">raised</span><span class="v">0 0 24 · 6%<br />cards, wells</span>
            </div>
            <div class="swatch">
                <div class="box overlay"></div>
                <span class="name">overlay</span><span class="v">18% ring · 5% · 12%<br />anything that floats</span>
            </div>
            <div class="swatch">
                <div class="pill offset3"></div>
                <span class="name">pop</span><span class="v">3 3 0 magenta</span>
            </div>
            <div class="swatch">
                <div class="pill offset5"></div>
                <span class="name">pop · hover</span><span class="v">5 5 0 magenta</span>
            </div>
        </div>
    </body>
</html>
