<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Chips and tiles — rest, hover, picked</title>
        <link rel="stylesheet" href="../colors_and_type.css" />
        <style>
            html,
            body {
                margin: 0;
            }
            .card {
                width: 700px;
                box-sizing: border-box;
                background: var(--color-surface-container-lowest);
                padding: 24px 28px;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: flex-start;
            }
            .chip {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                border-radius: 9999px;
                padding: 6px 14px;
                font: 700 11px/1 var(--font-label);
                letter-spacing: 0.04em;
            }
            .default {
                background: var(--color-surface-container);
                color: var(--color-on-surface);
            }
            .hover {
                background: var(--color-surface-container-high);
                color: var(--color-on-surface);
            }
            /* Picked: the selected fill (primary_soft) and a leading check — never colour alone. */
            .active {
                background: var(--color-selected);
                color: var(--color-on-selected);
                padding-left: 12px;
            }
            .tiles {
                flex-basis: 100%;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
                margin-top: 12px;
            }
            /* Large option tiles rest on the tile fill; picked, the selected fill plus SelectedMark top-right. */
            .tile {
                position: relative;
                min-height: 56px;
                box-sizing: border-box;
                padding: 12px 32px 10px 12px;
                border-radius: 8px;
                background: var(--tile-fill);
                color: var(--color-on-surface);
                font: 600 14px/1.25 var(--font-label);
            }
            .tile.picked {
                background: var(--color-selected);
                color: var(--color-on-selected);
            }
            .mark {
                position: absolute;
                top: 8px;
                right: 8px;
                width: 18px;
                height: 18px;
                border-radius: 9999px;
                background: var(--color-primary-container);
                color: var(--color-on-primary-container);
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <span class="chip active"
                ><svg class="ico-glyph" viewBox="0 0 24 24" width="12" height="12" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7" /></svg
                >Piano</span
            >
            <span class="chip default">Violin</span>
            <span class="chip default">Cello</span>
            <span class="chip default">Flute</span>
            <span class="chip hover">Oboe</span>
            <span class="chip default">Bassoon</span>
            <span class="chip default">Trombone</span>
            <span class="chip default">Tuba</span>
            <span class="chip default">Erhu</span>
            <span class="chip default">Dizi Flute</span>
            <span class="chip default">Shakuhachi</span>
            <span class="chip default">Pan Flute</span>
            <span class="chip default">Ocarina</span>
            <span class="chip default">Bagpipe</span>
            <span class="chip default">Recorder</span>
            <span class="chip default">Tin Whistle</span>
            <div class="tiles">
                <span class="tile picked"
                    >Voice<span class="mark"
                        ><svg class="ico-glyph" viewBox="0 0 24 24" width="12" height="12" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7" /></svg></span
                ></span>
                <span class="tile">Piano</span>
                <span class="tile">Guitar</span>
                <span class="tile">Violin</span>
            </div>
        </div>
    </body>
</html>
